[REPO]
url = https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
branch = master
name = linux-next
tag =

[LOG]
file = /local/mnt/workspace/playarea/linux-sheepdog-slave.log
level = INFO

[DEVICE]
arch = arm64
name = sm4450-qrd
vendor = qcom
cmdline = console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a60000 maxcpus=8
ramdisk_url = https://github.qualcomm.com/bjorande/ramdisk/releases/download/v1.0/ramdisk.cpio.gz

[TOOLS]
toolchain_prefix = aarch64-linux-gnu-
mkbootimg = /local/mnt/workspace/playarea/mkbootimg

[KERNEL_OPTION]
kernel = CONFIG_FTRACE
module =
close =